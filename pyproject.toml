[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whoerau-streamlink-plugins"
version = "0.1.0"
description = "Third-party Streamlink plugins packaged for pip installation."
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.13.0",
    "cryptography>=50.0.0",
    "curl-cffi>=0.12.0",
    "requests",
    "scrapling[fetchers]>=0.4.9",
    "streamlink>=8.3.0",
    "websockets>=15.0",
]

[tool.setuptools]
py-modules = [
    "bongacams",
    "browser_stream",
    "cam4",
    "camsoda",
    "chaturbate",
    "generic",
    "myfreecams",
    "showup",
    "stripchat",
    "zbiornik",
]
