[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whoerau-streamlink-plugins"
version = "0.1.0"
description = "Third-party Streamlink plugins packaged for pip installation."
requires-python = ">=3.8"
dependencies = [
    "requests",
    "streamlink>=8.3.0",
    "websocket-client",
]

[tool.setuptools]
py-modules = [
    "bongacams",
    "cam4",
    "camsoda",
    "chaturbate",
    "generic",
    "myfreecams",
    "showup",
    "stripchat",
    "zbiornik",
]
